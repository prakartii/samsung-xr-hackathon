# Metric floors on the `tune` split (CLAUDE.md §7.3.12), checked by test_floors.py.
# A drop below floor - tolerance fails. Raising a floor is normal; lowering one needs
# a reason in PROGRESS.md.
#
# Set 2026-11-13 from tools/predict_cached.py --split tune at config ae3f3677f0.
# Caveat: tune EPIC videos are ActionFormer's training videos, so `map` (and the
# coverage that depends on its proposals) is optimistic; it guards against
# regressions, it is not an estimate of the report score (0.117 mAP there).
tolerance: 0.005

tune_epic:          # 20 EPIC train videos
  coverage_any: 0.4687   # uniform 0.3583, oracle 0.7401
  coverage_frac: 0.2836  # uniform 0.1776
  pct_oracle: 0.6333     # uniform 0.4841
  map: 0.5266

tune_fpvsum_cv:     # mean over the 5 FPVSum CV folds (49 videos, 46 with usable GT timing)
  f1: 0.2228             # uniform 0.1636
  label_acc: 0.8352
