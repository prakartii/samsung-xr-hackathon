[project]
name = "rewind"
version = "0.1.0"
description = "REWIND: coverage-first egocentric video summarizer (Samsung XR Hackathon 2026, Track 4)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
# Heavy tiers are opt-in: `pytest -m "slow or data or gpu"` (CLAUDE.md §4, §7.1).
addopts = "-m 'not slow and not data and not gpu'"
markers = [
    "slow: long-running test (minutes)",
    "data: needs files under data/ or cache/",
    "gpu: needs a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["code", "tests"]
extend-exclude = ["code/third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
