# REWIND configuration. Every tunable number lives here, nowhere else (CLAUDE.md §6.3).
# Kit facts (4.0 s minimum, 15% budget, ...) are NOT here: see rewind/constants.py.
#
# A adds the sections A's phases use: signals, features, routing, prompts (P3) and
# actions, pairing (P4). B adds team, cluster, calibration, select, hedge, post,
# importance, label, eval in P1 (ARCHITECTURE.md §11).

actions:
  max_per_video: 1000     # actions[] cap after pairing (kit hard limit 2000 lives in constants); tuned in P4
  min_score: 0.0          # drop paired actions below this rescaled score; tuned in P4

pairing:                  # ARCHITECTURE.md §5.1
  match_tiou: 0.5         # a noun detection pairs with a verb detection at tIoU >= this
  k: 5                    # top-k verbs / nouns / pairs kept per proposal
  alpha: 0.5              # exponent on the verb-noun co-occurrence prior
  prior_eps: 0.5          # additive smoothing of train co-occurrence counts
  score_power: 0.5        # fixed monotone rescale: score = (p_v * p_n * prior^alpha) ^ power

signals:
  dense_fps: 4.0          # rate of flow + hands signals (ARCHITECTURE.md §2: 2-4 fps)
  clip_fps: 1.0           # rate of CLIP image embeddings (ARCHITECTURE.md §2)

features:
  flow:
    width: 160            # frames are resized to this width before Farneback (§10)
    pyr_scale: 0.5        # Farneback: image scale between pyramid levels
    levels: 3             # Farneback: number of pyramid levels
    winsize: 15           # Farneback: averaging window size (pixels)
    iterations: 3         # Farneback: iterations per pyramid level
    poly_n: 5             # Farneback: pixel neighbourhood for the polynomial expansion
    poly_sigma: 1.2       # Farneback: Gaussian sigma for the polynomial expansion
  hands:
    model: weights/hand_landmarker.task  # MediaPipe Hand Landmarker (tools/fetch_weights.sh)
    width: 320            # frames are resized to this width before detection
    num_hands: 2          # max hands per frame (egocentric: the wearer's two hands)
    min_detection_conf: 0.3   # palm detector threshold; low, since presence is a soft signal
    min_presence_conf: 0.3    # landmark-model hand presence threshold
    min_tracking_conf: 0.3    # below this, re-run palm detection instead of tracking
  clip:
    model: ViT-B-16       # open_clip architecture name (ARCHITECTURE.md §10)
    weights: weights/clip_vit_b16_openai.safetensors  # OpenAI weights (tools/fetch_weights.sh)
    width: 448            # frames are resized to this width before CLIP preprocessing
    batch_size: 32        # images per forward pass (CPU memory vs speed)

# Zero-shot prompts shared by routing (P(cooking), ARCHITECTURE.md §6.1) and the
# FPVSum label (§6.3). Each class embedding is the mean of its template embeddings
# (prompt ensemble). First pass; P6 tunes phrases on FPVSum CV folds only.
prompts:
  templates:
    - "a first-person video of {}."
    - "a photo taken by a person {}."
    - "a GoPro view while {}."
  classes:                # kit label key -> phrase; `other` is never a CLIP class
    bike: "riding a bicycle"
    bikepolo: "playing bike polo"
    boxing: "boxing"
    cooking: "cooking in a kitchen"
    horse: "riding a horse"
    jumping: "skydiving or jumping"
    longboarding: "riding a longboard"
    motor: "riding a motorcycle"
    parkour: "doing parkour"
    plane: "flying a small plane"
    rockclimbing: "rock climbing"
    scuba: "scuba diving underwater"
    skate: "skateboarding"
    ski: "skiing"
    surfing: "surfing a wave"

routing:
  cooking_thr: 0.5        # mean CLIP P(cooking) >= this -> EPIC route (tuned in P6)
  min_conf: 0.1           # |P(cooking) - cooking_thr| below this -> uncertain route (tuned in P6)
