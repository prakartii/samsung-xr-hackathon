# REWIND configuration. Every tunable number lives here (CLAUDE.md §6.3).
# Kit rules (4.0 s minimum, 15% budget, ±0.5 s, 2000 actions) are in
# code/rewind/constants.py, not here. Values marked "initial" are first guesses,
# tuned on the `tune` split in the phase named.

run:
  seed: 0                  # seeds Python, numpy and torch for byte-identical output

team:
  team_id: VITVellore_Nexus  # registered team name, used as the team ID (PROGRESS.md Q11); same in every file

signals:
  dense_fps: 4.0           # rate for flow and hand signals (2–4 fps); P3 chose 4 (finer hedge peaks), caches use it
  clip_fps: 1.0            # rate for CLIP image embeddings

features:
  cache_dir: cache         # root of the versioned feature cache (ARCHITECTURE.md §8)
  flow:                    # Farneback optical flow (features/flow.py)
    width: 160             # frame width in px for Farneback flow
    pyr_scale: 0.5         # image scale between pyramid levels
    levels: 3              # number of pyramid levels
    winsize: 15            # averaging window size, px
    iterations: 3          # iterations per pyramid level
    poly_n: 5              # pixel neighbourhood for the polynomial expansion
    poly_sigma: 1.2        # Gaussian sigma for the polynomial expansion
  hands:                   # MediaPipe Hand Landmarker (features/hands.py)
    model: weights/hand_landmarker.task  # fetched by tools/fetch_weights.sh
    width: 320             # frame width in px before detection
    num_hands: 2           # max hands per frame (the wearer's two hands)
    min_detection_conf: 0.3  # palm detector threshold; low, presence is a soft signal
    min_presence_conf: 0.3   # landmark-model hand presence threshold
    min_tracking_conf: 0.3   # below this, re-run palm detection instead of tracking
  clip:                    # open_clip ViT-B/16, OpenAI weights (features/clip.py)
    model: ViT-B-16        # open_clip architecture name (ARCHITECTURE.md §10)
    weights: weights/clip_vit_b16_openai.safetensors  # fetched by tools/fetch_weights.sh
    width: 448             # frame width in px before CLIP preprocessing
    batch_size: 32         # images per forward pass (speed only, not in the cache version)
  audio:                   # loudness + spectral flux (features/audio.py), FPVSum route only
    sample_rate: 8000      # mono resample rate in Hz
    window: 0.5            # s of audio summarised around each dense timestep

actions:
  max_per_video: 2000      # cap on actions[] per video (kit max 2000); initial, tuned in P4
  min_score: 0.0           # drop actions below this score; initial, tuned in P4
  prior_alpha: 0.0         # verb-noun prior exponent for output action scores (pairing.alpha is for the selector's proposals); P7 ablation
  pair_keep: 5             # output (verb, noun) pairs kept per verb segment, of top_k x top_k (selector unaffected)
  match_tiou: 0.3          # output-only verb-noun gate (nouns only; selector keeps pairing.match_tiou); P#1 2026-11-22: train dev mAP +0.0039, val +0.0021
  soft_nms_sigma: 0.0      # per-class Gaussian soft-NMS on output actions; 0 = off
  # Campaign #4: learned P(true positive) per output action (tools/train_rescore.py); empty = off.
  # Order: rewind.detect.rescore.FEATURES.
  # fit 2026-11-22 on dev + 175 extra train videos; dev OOF mAP 0.5144 -> 0.5450, val 0.5447 -> 0.5753
  rescore_coef: [-5.15503, 5.07428, -1.75518, -1.87369, -0.15095, -0.222303, -0.699566, 0.306352, -0.0808221, -0.020351, 0.0362134, 0.0315185, 0.231964, -0.145381, -0.0940619, -0.0661327, -0.343636]
  rescore_mean: [0.487136, 0.269356, 0.294532, 0.324885, 0.412697, 0.863668, 0.719571, 0.781949, 0.491151, 1.4824, 1.53839, 2.51277, 5.02491, 4.25641, 0.574258, 0.100608]
  rescore_std: [0.126404, 0.195421, 0.171681, 0.463494, 0.51112, 0.58449, 0.19032, 0.775345, 0.294661, 0.527765, 1.16688, 1.06228, 1.24063, 1.12337, 0.144646, 0.15709]
  rescore_old_power: 0.0   # output score = P(TP) * pairing score ** this (when rescore_coef is set)

pairing:
  match_tiou: 0.5          # min tIoU to pair a verb proposal with a noun proposal; initial, P4
  top_k: 5                 # verbs and nouns kept per proposal when pairing
  alpha: 1.0               # exponent on the verb–noun co-occurrence prior
  eps: 1.0                 # additive smoothing for prior counts
  score_power: 0.25        # fixed monotone rescale: (p_v * p_n * prior^alpha) ** power; tune 2026-11-21 (official rule) 0.5 -> 0.25; monotone, so mAP unchanged

detect:                    # ActionFormer (detect/actionformer.py); files from tools/fetch_weights.sh
  verb_config: code/third_party/actionformer/configs/epic_slowfast_verb.yaml
  noun_config: code/third_party/actionformer/configs/epic_slowfast_noun.yaml
  verb_checkpoint: weights/actionformer_epic_verb.pth.tar
  noun_checkpoint: weights/actionformer_epic_noun.pth.tar
  vn_prior: weights/vn_prior.npy  # verb-noun counts, EPIC train only (tools/build_vn_prior.py)
  released_features: weights/released_features  # ActionFormer's released SlowFast features, read-only cache (tools/import_released_features.py --cache); found by content fingerprint

zeroshot:                  # detect/fallback_zeroshot.py: kill-rule + uncertain-route detector (P4)
  window_sec: 2.0          # sliding window over 1 fps CLIP embeddings (REWIND_v2.3_plan §7)
  stride_sec: 1.0          # window step
  top_k: 3                 # verb / noun classes emitted per window
  verb_template: "a first-person photo of hands that {} something."
  noun_template: "a first-person photo of a {}."

cluster:
  tiou: 0.4                # min tIoU to link two proposals; 2026-11-22: dev +0.020 (88/27), val +0.012 (57/39), tune +0.009 (11/4); was 0.2
  sim: 1.0                 # CLIP-similarity linking off (Campaign #3): the learned pair scorer is trained on label-linked clusters, so production clusters the same way (was 0.85)
  k: 5                     # top pairs kept per cluster distribution

calibration:
  temperature: 1.0         # temperature on cluster pair distributions (stretch S1)

select:
  window_lengths: [4.05, 5.0, 6.0]  # candidate window lengths in s; each >= 4.05
  stride: 0.25             # candidate window start grid in s; tune 2026-11-21 (official rule) 1.0 -> 0.25 (was 0.5 -> 1.0 under any-overlap, P7)
  budget_frac: 0.145       # highlight budget as a fraction of T (kit 0.15 minus a margin)
  capture_rule: fraction   # any_overlap | fraction; official rule (>= 50% inside, Q4); tune 2026-11-21: 0.2883 -> 0.2970
  fraction_theta: 0.55     # fraction rule: overlap/span midpoint of the sigmoid; tune 2026-11-21 0.5 -> 0.55
  fraction_tau: 0.05       # fraction rule: sigmoid temperature
  mode: expected           # expected | dedup: expected coverage (§5.4), or the label-dedup baseline (P5 kill rule)
  # Campaign #2 (2026-11-22): learned P(real) per cluster replaces confidence (tools/train_reality.py,
  # fit on the C2 dev train videos; val AUC 0.801 vs confidence 0.747). Order: rewind.select.reality.FEATURES.
  reality_coef: [0.596161, 2.21744, 0.114748, 0.679992, -0.316709, -0.225111, -0.270198, -0.0377114, 0.268162, -0.898097]
  reality_mean: [0.259161, 0.793516, 0.779124, 0.843859, 0.433927, 0.211366, 0.489595, 2.76317, 0.5]
  reality_std: [0.130352, 0.245163, 0.788694, 0.300582, 0.24138, 0.307934, 0.295463, 0.424474, 0.289708]
  # Campaign #3 (2026-11-22): learned P(pair) per (cluster, pair) replaces the distribution
  # (tools/train_pairs.py, fit on dev + extra train videos; val AUC 0.795 vs 0.737). Order: PAIR_FEATURES.
  pair_coef: [-2.51049, 0.741573, 0.314283, 0.1798, 0.269027, -0.126972, 0.127197, -0.0294875, 0.0706061, 0.0820776, 0.513492, -0.0968663, 0.886607]
  pair_mean: [0.266889, 0.80439, 0.804802, 0.923154, 0.357552, 0.127913, 0.488272, 2.80508, 0.534379, 0.246835, 0.870885, 0.715048]
  pair_std: [0.127025, 0.25473, 0.790663, 0.169071, 0.166745, 0.19806, 0.296003, 0.3974, 0.276561, 0.170635, 0.582299, 0.268926]
  pair_power: 1.0          # pair weight = P(pair) ** pair_power
  confidence_power: 2.0    # power on the cluster weight (learned P(real) since Campaign #2; was confidence ** 1.0, X1)

hedge:
  share: 0.0               # budget fraction for hedge windows; off: lost coverage on tune at 0.1 and 0.2 (2026-11-21)
  gap: 1.0                 # s kept clear around selected windows
  strong: 0.8              # clusters at or above this confidence are masked out
  min_spacing: 10.0        # min s between hedge window centres
  w_flow: 1.0              # activity weight on z-scored flow
  w_hands: 1.0             # activity weight on hand presence

post:
  merge_gap: 0.5           # merge highlights closer than this many s (FPVSum route, fallback)
  merge_gap_epic: 2.0      # same, EPIC route (selector union + post-processing); tune 2026-11-21 (X0) 0.5 -> 2.0
  short_video_mode: min_seg  # min_seg | within_budget (ARCHITECTURE.md §5.6); ship min_seg

importance:
  sigma: 6.0               # Gaussian smoothing of importance in s; 2026-11-22 YouTube Highlights F1 (was 2.0)
  shot_thr: 0.2            # CLIP change-point threshold for shot boundaries; initial, P6
  w_flow: 1.0              # importance weight: residual flow
  w_hands: 1.0             # importance weight: hand presence
  w_global_motion: 0.5     # importance weight: camera motion
  w_scene_change: -0.5     # importance weight: scene change; 2026-11-22 YouTube Highlights F1: cuts are not highlights (was 0.5)
  min_window: 4.05         # shortest FPVSum window in s (>= 4.05)
  max_window: 10.0         # longest FPVSum window in s
  len_step: 1.0            # window-length grid step in s between min_window and max_window; P6
  stride: 0.5              # window start grid step in s; P6
  w_audio_rms: 0.0         # importance weight: z(log loudness); 0 = off. Was 1.0, chosen on FPVSum GT (CV);
                           # off since the organizers asked to treat that GT as hidden test labels (PROGRESS.md Q13)
  fill_step: 0.5           # P6 F1 campaign: > 0 grows chosen windows edge by edge (this many s) into the most important
                           # adjacent time until the budget is used (greedy stops with < min_window left)
  w_audio_flux: 0.0        # importance weight: z(spectral flux); 0 = off (was 0.25, same reason)

label:
  prompts:                 # CLIP prompt templates; {} is the category name
    - "a first-person video of {}"
    - "a GoPro video of {}"
    - "a photo of someone doing {}"
  classes:                 # kit label -> CLIP phrase; routing (cooking) and the FPVSum label; initial, P6
    bike: "riding a bicycle"
    bikepolo: "playing bike polo"
    boxing: "boxing"
    cooking: "cooking in a kitchen"
    horse: "riding a horse"
    jumping: "skydiving or jumping"
    longboarding: "riding a longboard"
    motor: "riding a motorcycle"
    parkour: "doing parkour"
    plane: "flying a small plane"
    rockclimbing: "rock climbing"
    scuba: "scuba diving underwater"
    skate: "skateboarding"
    ski: "skiing"
    surfing: "surfing a wave"
  n_keyframes: 8           # evenly spaced frames averaged for the label
  other_thr: 0.2           # below this top probability on the uncertain route, label "other"

routing:
  cooking_thr: 0.5         # CLIP P(cooking scene) at or above this → EPIC route; initial, P6
  min_conf: 0.1            # route margin below this → uncertain route; initial, P6

eval:
  coverage_lambda: 1.0     # over-budget penalty slope in our coverage metric (Q8)
  capture_theta: 0.5       # coverage metric's fraction rule: share of an action a highlight must cover (Q4)
